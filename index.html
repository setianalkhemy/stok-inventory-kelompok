<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Stok Inventory</title>
  <link rel="stylesheet" href="tugaskelompok3orang.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 Manajemen Stok Inventory</h1>
      <p>Dashboard pemantauan keluar-masuk barang gudang</p>
    </header>

    <!-- Kartu Ringkasan (Summary Cards) -->
    <section class="summary-cards">
      <div class="card">
        <h3>Total Jenis Barang</h3>
        <p id="total-jenis">0</p>
      </div>
      <div class="card">
        <h3>Total Seluruh Stok</h3>
        <p id="total-stok">0</p>
      </div>
      <div class="card warning">
        <h3>Stok Menipis / Habis</h3>
        <p id="stok-menipis">0</p>
      </div>
    </section>

    <!-- Form Tambah Barang -->
    <section class="form-section">
      <h2>Tambah Barang Baru</h2>
      <form id="form-tambah">
        <input type="text" id="nama-barang" placeholder="Nama Barang (misal: Laptop Asus)" required>
        <select id="kategori-barang" required>
          <option value="" disabled selected>Pilih Kategori</option>
          <option value="Elektronik">Elektronik</option>
          <option value="ATK">ATK</option>
          <option value="Konsumsi">Konsumsi</option>
          <option value="Lainnya">Lainnya</option>
        </select>
        <input type="number" id="jumlah-stok" placeholder="Stok Awal" min="0" required>
        <button type="submit" class="btn-primary">+ Tambah Barang</button>
      </form>
    </section>

    <!-- Filter & Pencarian -->
    <section class="filter-section">
      <input type="text" id="input-search" placeholder="🔍 Cari nama barang...">
      <select id="filter-kategori">
        <option value="Semua">Semua Kategori</option>
        <option value="Elektronik">Elektronik</option>
        <option value="ATK">ATK</option>
        <option value="Konsumsi">Konsumsi</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </section>

    <!-- Tabel Daftar Barang -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Barang</th>
            <th>Kategori</th>
            <th>Stok</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-barang">
          <!-- Baris data akan diisi otomatis oleh JavaScript -->
        </tbody>
      </table>
      <p id="pesan-kosong" class="empty-msg">Belum ada data barang.</p>
    </section>
  </div>

  <script src="tugaskelompok3orang.js"></script>
</body>
</html>
